
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kjm uchun ❤️</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;padding:25px 15px;
 display:flex;align-items:center;justify-content:center;
 background:radial-gradient(circle at top,#54152f,#170914 65%,#090609);
 color:#fff;font-family:Georgia,serif;text-align:center;
 overflow-x:hidden
}
.card{
 width:100%;max-width:440px;padding:30px 22px;
 background:#ffffff0d;border:1px solid #d6a05b66;
 border-radius:24px;box-shadow:0 0 35px #0008;
 position:relative;z-index:2
}
h1{color:#f4c78d;font-size:27px}
h2{color:#f4c78d;font-size:22px}
p{line-height:1.7;color:#f5e8e8}
.heart{font-size:43px;animation:pulse 1.5s infinite}
@keyframes pulse{50%{transform:scale(1.2)}}
button{
 border:0;border-radius:30px;padding:13px 24px;
 background:linear-gradient(90deg,#a72d54,#d18b54);
 color:white;font-size:16px;margin-top:15px;cursor:pointer
}
button:disabled{opacity:.5}
input,textarea{
 width:100%;padding:13px;margin-top:15px;
 border:1px solid #d6a05b88;border-radius:12px;
 background:#210f1b;color:white;font-size:16px;
 outline:none
}
textarea{min-height:85px;resize:vertical}
.progress{height:6px;background:#ffffff22;border-radius:10px;margin:20px 0}
.bar{height:6px;width:0;background:#e7b36e;border-radius:10px;transition:.4s}
.hidden{display:none}
.letter{text-align:left;white-space:pre-line;line-height:1.9}
.floating{
 position:fixed;bottom:-30px;color:#e7a0b6;
 animation:float 7s linear infinite;opacity:.7
}
@keyframes float{
 to{transform:translateY(-110vh) rotate(360deg);opacity:0}
}
</style>
</head>
<body>
<div class="card">
 <div class="heart">❤️</div>
 <h1>Kjm uchun...</h1>
 <p>Bu oddiy sahifa emas. Bu yerda sani kutayotgan kichkina bir sir bor. 🥹</p>
 <p>Uni ochish uchun 5 ta bosqichdan o'tishing kerak.</p>
 <button onclick="start()">Boshlash 🌹</button>

 <div id="game" class="hidden">
  <div class="progress"><div class="bar" id="bar"></div></div>
  <p id="number"></p>
  <h2 id="question"></h2>
  <p id="description"></p>
  <textarea id="answer" placeholder="Javobingni shu yerga yoz..."></textarea>
  <button onclick="next()">Keyingi bosqich ❤️</button>
 </div>

 <div id="finish" class="hidden">
  <div class="heart">💌</div>
  <h2>Tabriklayman, Kjm! 🥹</h2>
  <p>Barcha bosqichlardan o'tding. Endi eng muhim sirni ochamiz...</p>
  <button onclick="showLetter()">Maktubni ochish 💗</button>
 </div>

 <div id="letter" class="hidden">
  <h2>Mening sanga maktubim ❤️</h2>
  <div class="letter" id="letterText"></div>
 </div>
</div>

<script>
const stages=[
 ["Bizning hikoyamiz","Biz ilk marta qayerda tanishganmiz?","Hikoyamizning boshlanishini eslay olasanmi?"],
 ["Meni qanchalik bilasan?","Maning eng katta orzularimdan biri nima?","Man xafa bo'lganimda sani qanday yordaming kerak bo'ladi?"],
 ["Yurak siri","Menda eng yoqadigan 3 ta xislat qaysi?","Nega aynan mani tanlagansan?"],
 ["Kelajak sari","Real hayotda uchrashganimizda birinchi nima qilamiz?","Birgalikdagi eng katta orzumiz nima?"],
 ["Oxirgi sir","Manga aytmoqchi bo'lib, lekin hali aytolmagan gaping bormi?","Bu oxirgi bosqich. Yuragingdagini yoz. ❤️"]
];
let step=0;
function start(){
 document.querySelector("button").classList.add("hidden");
 document.getElementById("game").classList.remove("hidden");
 render();
}
function render(){
 document.getElementById("number").textContent="BOSQICH "+(step+1)+" / 5";
 document.getElementById("question").textContent=stages[step][0];
 document.getElementById("description").textContent=stages[step][1]+"\n"+stages[step][2];
 document.getElementById("bar").style.width=(step*20)+"%";
 document.getElementById("answer").value="";
}
function next(){
 if(step<4){
  step++;
  render();
 }else{
  document.getElementById("game").classList.add("hidden");
  document.getElementById("finish").classList.remove("hidden");
  document.getElementById("bar").style.width="100%";
 }
}
function showLetter(){
 document.getElementById("finish").classList.add("hidden");
 document.getElementById("letter").classList.remove("hidden");
 document.getElementById("letterText").textContent=
`Salom, mening eng qadrli insonim... 🥹❤️

Agar hozir shu maktubni o'qiyotgan bo'lsang, demak, barcha bosqichlardan muvaffaqiyatli o'tibsan. Lekin bilasanmi, bu kvestdagi eng katta yutuq — savollarga to'g'ri javob berishing emas, balki hayotimda borliging...

Bilasanmi, ba'zida sanga bo'lgan hislarimni so'z bilan tushuntirishga qiynalaman. Shunchaki sani o'ylasam ham kayfiyatim o'zgarib ketadi. Sani borliging, mani tushunishing, hatto arzimas gaplarimiz ham men uchun juda qadrli. Balki har doim ham buni ko'rsatolmasman, lekin sani juda-juda qadrlayman. 🥹❤️

Oramizda qancha masofa borligi muhim emas, chunki qalbimdagi joyingni hech qanday masofa o'zgartira olmaydi. Hali oldinda birga kuladigan, sayr qiladigan, bir-birimizga mehr beradigan kunlarimiz bor. Men o'sha kunlarni juda kutyapman. Xudo xohlasa, bugungi virtual quchoqlarimiz bir kun haqiqiy quchoqlarga aylanadi. 🫂❤️

Sanga bir narsani aytmoqchiman: men hamma narsani birdaniga va'da berolmayman, lekin harakat qilishga va'da beraman. Sani tushunishga, hurmat qilishga, quvonchli kunlaringda ham, qiyin paytlaringda ham yoningda bo'lishga harakat qilaman. Men uchun muhabbat faqat chiroyli so'zlar emas, balki amalda ko'rsatiladigan mehr va ishonchdir. 🥹❤️

Bilasanmi, men kelajak haqida o'ylaganimda, o'sha manzaralarda sani ham ko'raman. Bir kun kelib bugungi kunlarimizni eslab kulishimizni, qanday uzoq masofalardan o'tib, bir-birimizga yetib kelganimizni gaplashishimizni xohlayman. Alloh niyatlarimizga yetkazsin. Hali birga juda ko'p chiroyli xotiralar yaratamiz, inshaalloh.

Sani sevaman, Kjm. ❤️🥹`;
}
function hearts(){
 const h=document.createElement("div");
 h.className="floating";h.textContent=["❤","♡","🌹","💕"][Math.floor(Math.random()*4)];
 h.style.left=Math.random()*100+"%";
 h.style.fontSize=(18+Math.random()*18)+"px";
 document.body.appendChild(h);
 setTimeout(()=>h.remove(),7000);
}
setInterval(hearts,700);
</script>
</body>
</html>
